<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RefactorLab - 15 Misiones de Diseño de Software</title>
    <style>
        :root {
            --bg-main: #0f141c; --bg-sidebar: #161b22; --bg-editor: #1b212c; --bg-panel: #1f2735;
            --text-main: #e6edf3; --text-muted: #8b949e; --accent: #2f81f7; --accent-hover: #58a6ff;
            --success: #3fb950; --success-bg: rgba(63, 185, 80, 0.1); --error: #f85149;
            --error-bg: rgba(248, 81, 73, 0.1); --warning: #d29922; --teacher-bg: #2d1f10;
            --teacher-border: #d29922; --border-color: #30363d;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-main); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 340px; background-color: var(--bg-sidebar); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; z-index: 10; }
        .sidebar-header { padding: 24px; border-bottom: 1px solid var(--border-color); }
        .sidebar-header h1 { font-size: 1.4rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .sidebar-header h1 span { color: var(--accent); }
        .sidebar-stats { font-size: 0.75rem; color: var(--success); margin-top: 8px; font-weight: bold; }
        .mission-list { flex: 1; overflow-y: auto; padding: 16px; }
        .mission-item { width: 100%; background: none; border: 1px solid transparent; color: var(--text-muted); padding: 12px 14px; margin-bottom: 6px; border-radius: 8px; cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 4px; }
        .mission-item:hover { background-color: rgba(255, 255, 255, 0.03); color: var(--text-main); }
        .mission-item.active { background-color: rgba(47, 129, 247, 0.1); border-color: rgba(47, 129, 247, 0.4); color: var(--accent-hover); }
        .mission-item .m-title { font-weight: 600; font-size: 0.9rem; }
        .mission-item .m-author { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--warning); }
        .workspace { flex: 1; display: flex; flex-direction: row; height: 100%; }
        .instructions-panel { width: 35%; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; background-color: var(--bg-main); }
        .panel-header { padding: 16px 24px; border-bottom: 1px solid var(--border-color); background-color: rgba(0,0,0,0.1); }
        .panel-body { flex: 1; overflow-y: auto; padding: 24px; line-height: 1.6; font-size: 0.95rem; }
        .code-smell-box { background-color: rgba(210, 153, 34, 0.05); border-left: 4px solid var(--warning); padding: 12px; border-radius: 4px; margin-bottom: 16px; font-size: 0.85rem; }
        .editor-panel { width: 65%; display: flex; flex-direction: column; background-color: var(--bg-editor); }
        .editor-wrapper { flex: 1; display: flex; flex-direction: column; }
        .editor-header { padding: 12px 24px; background-color: var(--bg-sidebar); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .file-tab { background-color: var(--bg-editor); padding: 8px 16px; border-radius: 6px 6px 0 0; border: 1px solid var(--border-color); border-bottom: none; font-family: monospace; font-size: 0.85rem; margin-bottom: -13px; color: var(--accent-hover); }
        .editor-textarea-container { flex: 1; display: flex; background-color: #0d1117; padding: 16px; overflow: hidden; }
        .line-numbers { width: 35px; text-align: right; padding-right: 12px; font-family: 'Fira Code', 'Courier New', Courier, monospace; font-size: 14px; color: #484f58; user-select: none; line-height: 1.5; }
        textarea.code-input { flex: 1; background: transparent; border: none; color: #e6edf3; font-family: 'Fira Code', 'Courier New', Courier, monospace; font-size: 14px; line-height: 1.5; resize: none; outline: none; white-space: pre; overflow: auto; }
        .action-bar { padding: 12px 24px; background-color: var(--bg-sidebar); border-top: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .btn { background-color: var(--accent); color: white; border: none; padding: 10px 20px; font-size: 0.9rem; font-weight: 600; border-radius: 6px; cursor: pointer; }
        .btn-success { background-color: var(--success); }
        .console-panel { height: 160px; background-color: #0d1117; border-top: 1px solid var(--border-color); padding: 12px 24px; font-family: monospace; overflow-y: auto; }
        .output-status { display: inline-block; padding: 4px 8px; border-radius: 4px; margin-bottom: 8px; font-weight: bold; font-size: 0.8rem; }
        .status-success { background-color: var(--success-bg); color: var(--success); }
        .status-error { background-color: var(--error-bg); color: var(--error); }
        .teacher-panel { display: none; background-color: var(--teacher-bg); border-top: 2px solid var(--teacher-border); padding: 16px 24px; max-height: 250px; overflow-y: auto; }
        footer { padding: 8px 24px; background-color: var(--bg-sidebar); font-size: 0.75rem; color: var(--text-muted); text-align: right; border-top: 1px solid var(--border-color); }
        .secret-hint { cursor: pointer; user-select: none; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: var(--bg-panel); padding: 24px; border-radius: 8px; border: 1px solid var(--border-color); text-align: center; width: 300px; }
        .modal-content input { width: 100%; padding: 10px; margin-bottom: 16px; border-radius: 4px; border: 1px solid var(--border-color); background: var(--bg-main); color: var(--text-main); }
        .modal-btn { background: var(--warning); color: #000; border: none; padding: 10px 20px; border-radius: 4px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header"><h1>Refactor<span>Lab</span></h1><p>Laboratorio de Arquitectura</p></div>
        <div class="mission-list" id="mission-list"></div>
        <footer><span class="secret-hint" id="secret-trigger">🔒 Módulo Instructor</span></footer>
    </div>
    <div class="workspace">
        <div class="instructions-panel">
            <div class="panel-header"><h2 id="panel-mission-title">Cargando...</h2></div>
            <div class="panel-body">
                <div class="code-smell-box"><strong>Code Smell:</strong> <span id="code-smell-text">...</span></div>
                <h3>Situación</h3><p id="mission-description"></p>
                <h3>Objetivos</h3><ul id="mission-objectives"></ul>
            </div>
        </div>
        <div class="editor-panel">
            <div class="editor-header"><div class="file-tab">Mision.java</div></div>
            <div class="editor-textarea-container">
                <div class="line-numbers" id="line-numbers"></div>
                <textarea class="code-input" id="code-editor" spellcheck="false" wrap="off"></textarea>
            </div>
            <div class="action-bar">
                <button class="btn btn-success" onclick="evaluateRefactor()">Ejecutar Validadores</button>
            </div>
            <div class="console-panel">
                <div id="console-status-badge" class="output-status">IDLE</div>
                <div class="console-output" id="console-output">Selecciona misión.</div>
            </div>
            <div class="teacher-panel" id="teacher-panel">
                <h3>🔑 Solución Fowler</h3>
                <pre><code id="teacher-solution-code"></code></pre>
            </div>
        </div>
    </div>
    <div class="modal-overlay" id="password-modal">
        <div class="modal-content">
            <h3>Acceso Instructor</h3>
            <input type="password" id="auth-code" placeholder="Clave...">
            <button class="modal-btn" onclick="verifyPassword()">Desbloquear</button>
        </div>
    </div>
    <script>
        const catalog = [
     const catalog = [
    { id: "m1", title: "1. Extract Method", smell: "Método Largo", desc: "Extrae el banner y detalles del método.", initialCode: "public void printOwing(double amount) {\n    // Banner\n    System.out.println(\"*****\");\n    System.out.println(\"name: \" + name);\n    System.out.println(\"amount: \" + amount);\n}", solution: "public void printOwing(double amount) { printBanner(); printDetails(amount); }", validate: c => c.includes("printBanner") && c.includes("printDetails") ? "OK" : "Debes extraer el banner y los detalles a métodos privados." },
    { id: "m2", title: "2. Magic Number", smell: "Números Mágicos", desc: "Sustituye 9.81 por constante.", initialCode: "public double getEnergy(double m) { return m * 9.81; }", solution: "private static final double G = 9.81; public double getEnergy(double m) { return m * G; }", validate: c => c.includes("G") ? "OK" : "Usa una constante para 9.81." },
    { id: "m3", title: "3. Decompose Conditional", smell: "Condicionales Complejos", desc: "Extrae a isSummer().", initialCode: "if (date.before(SUMMER_START) || date.after(SUMMER_END)) { ... }", solution: "if (isSummer(date)) { ... } private boolean isSummer(Date date) { return !date.before(SUMMER_START) && !date.after(SUMMER_END); }", validate: c => c.includes("isSummer") ? "OK" : "Extrae la condición a isSummer()." },
    { id: "m4", title: "4. Rename Variable", smell: "Nombres vagos", desc: "Cambia 'd' por 'elapsedDays'.", initialCode: "public int penalty(int d) { return d * 5; }", solution: "public int penalty(int elapsedDays) { return elapsedDays * 5; }", validate: c => c.includes("elapsedDays") ? "OK" : "Cambia el nombre de la variable." },
    { id: "m5", title: "5. Inline Temp", smell: "Temp inútil", desc: "Elimina variable y retorna expresión.", initialCode: "boolean b = price > 100; return b;", solution: "return price > 100;", validate: c => !c.includes("boolean b") ? "OK" : "Retorna la expresión directamente." },
    { id: "m6", title: "6. Extract Variable", smell: "Expresión compleja", desc: "Usa variables para el IF.", initialCode: "if (plat.contains(\"MAC\") && brow.contains(\"IE\"))", solution: "boolean isMac = plat.contains(\"MAC\"); boolean isIE = brow.contains(\"IE\"); if (isMac && isIE)", validate: c => c.includes("isMac") ? "OK" : "Extrae las condiciones a variables booleanas." },
    { id: "m7", title: "7. Split Temp", smell: "Reutilizar variable", desc: "Usa 'perim' y 'area' por separado.", initialCode: "double t = 2 * (h+w); print(t); t = h*w; print(t);", solution: "double perim = 2 * (h+w); print(perim); double area = h*w; print(area);", validate: c => c.includes("perim") && c.includes("area") ? "OK" : "No reutilices 't', usa nombres distintos." },
    { id: "m8", title: "8. Remove Assignment", smell: "Mutar parámetros", desc: "Usa variable 'result'.", initialCode: "int discount(int val) { val -= 2; return val; }", solution: "int discount(int val) { int res = val; res -= 2; return res; }", validate: c => c.includes("res =") ? "OK" : "No modifiques el parámetro, usa una variable local." },
    { id: "m9", title: "9. Guard Clauses", smell: "Arrow code", desc: "Usa returns anticipados.", initialCode: "if (a) { if (b) { return x; } }", solution: "if (!a) return null; if (!b) return null; return x;", validate: c => c.includes("return") && !c.includes("else") ? "OK" : "Usa guard clauses." },
    { id: "m10", title: "10. Consolidate Duplicate", smell: "Código duplicado", desc: "Saca sendEmail() del if/else.", initialCode: "if (p) { a(); send(); } else { b(); send(); }", solution: "if (p) { a(); } else { b(); } send();", validate: c => (c.match(/send\(\)/g) || []).length === 1 ? "OK" : "Ejecuta send() solo una vez." },
    { id: "m11", title: "11. Consolidate Conditional", smell: "IF en cascada", desc: "Usa || en un solo IF.", initialCode: "if(a) return 0; if(b) return 0;", solution: "if(a || b) return 0;", validate: c => c.includes("||") ? "OK" : "Combina los IFs con ||." },
    { id: "m12", title: "12. Remove Control Flag", smell: "Flag de control", desc: "Usa break.", initialCode: "while(!done) { if(x) done=true; }", solution: "while(true) { if(x) break; }", validate: c => c.includes("break") ? "OK" : "Usa break en lugar de flags." },
    { id: "m13", title: "13. Encapsulate Field", smell: "Campo público", desc: "Usa private y getters.", initialCode: "public String name;", solution: "private String name; public String getName() { return name; }", validate: c => c.includes("private") && c.includes("getName") ? "OK" : "Encapsula el campo." },
    { id: "m14", title: "14. Preserve Object", smell: "Lista de parámetros", desc: "Pasa el objeto entero.", initialCode: "check(obj.getA(), obj.getB());", solution: "check(obj);", validate: c => c.includes("check(obj)") ? "OK" : "Pasa el objeto completo." },
    { id: "m15", title: "15. Substitute Algorithm", smell: "Algoritmo manual", desc: "Usa Streams o contains.", initialCode: "for(String p : list) if(p.equals(\"A\")) return true;", solution: "return list.contains(\"A\");", validate: c => c.includes("contains") ? "OK" : "Usa funciones de colección." }
];
        let isTeacherMode = false;
        function toggleTeacherArea() {
            if (isTeacherMode) { document.getElementById('teacher-panel').style.display = 'block'; }
            else { document.getElementById('password-modal').style.display = 'flex'; }
        }
        function verifyPassword() {
            if (document.getElementById('auth-code').value === '2222') {
                isTeacherMode = true;
                document.getElementById('password-modal').style.display = 'none';
                document.getElementById('teacher-panel').style.display = 'block';
            } else { alert('Clave incorrecta'); }
        }
        function initApp() { /* Lógica de inicialización */ }
        window.onload = initApp;
    </script>
</body>
</html>
