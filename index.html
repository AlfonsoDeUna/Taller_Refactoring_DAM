<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RefactorLab - 15 Misiones de Diseño de Software</title>
    <style>
        :root {
            --bg-main: #0f141c;
            --bg-sidebar: #161b22;
            --bg-editor: #1b212c;
            --bg-panel: #1f2735;
            --text-main: #e6edf3;
            --text-muted: #8b949e;
            --accent: #2f81f7;
            --accent-hover: #58a6ff;
            --success: #3fb950;
            --success-bg: rgba(63, 185, 80, 0.1);
            --error: #f85149;
            --error-bg: rgba(248, 81, 73, 0.1);
            --warning: #d29922;
            --teacher-bg: #2d1f10;
            --teacher-border: #d29922;
            --border-color: #30363d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 340px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .sidebar-header {
            padding: 24px;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sidebar-header h1 span { color: var(--accent); }
        .sidebar-header p { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; }
        .sidebar-stats { font-size: 0.75rem; color: var(--success); margin-top: 8px; font-weight: bold; }

        .mission-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        /* Custom Scrollbar for Sidebar */
        .mission-list::-webkit-scrollbar { width: 6px; }
        .mission-list::-webkit-scrollbar-track { background: transparent; }
        .mission-list::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }

        .mission-item {
            width: 100%;
            background: none;
            border: 1px solid transparent;
            color: var(--text-muted);
            padding: 12px 14px;
            margin-bottom: 6px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .mission-item:hover { background-color: rgba(255, 255, 255, 0.03); color: var(--text-main); }
        .mission-item.active {
            background-color: rgba(47, 129, 247, 0.1);
            border-color: rgba(47, 129, 247, 0.4);
            color: var(--accent-hover);
        }

        .mission-item .m-title { font-weight: 600; font-size: 0.9rem; }
        .mission-item .m-author { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--warning); }

        /* Workspace */
        .workspace { flex: 1; display: flex; flex-direction: row; height: 100%; }

        .instructions-panel {
            width: 35%;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            background-color: var(--bg-main);
        }

        .panel-header { padding: 16px 24px; border-bottom: 1px solid var(--border-color); background-color: rgba(0,0,0,0.1); }
        .panel-header h2 { font-size: 1.1rem; font-weight: 600; color: var(--accent-hover); }

        .panel-body { flex: 1; overflow-y: auto; padding: 24px; line-height: 1.6; font-size: 0.95rem; }
        .panel-body h3 { font-size: 1rem; margin: 20px 0 8px 0; color: #fff; }
        .panel-body p, .panel-body ul { margin-bottom: 14px; color: #c9d1d9; }
        .panel-body ul { margin-left: 20px; }

        .code-smell-box {
            background-color: rgba(210, 153, 34, 0.05);
            border-left: 4px solid var(--warning);
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 16px;
            font-size: 0.85rem;
        }

        .editor-panel { width: 65%; display: flex; flex-direction: column; background-color: var(--bg-editor); }
        
        .editor-wrapper { flex: 1; display: flex; flex-direction: column; }
        .editor-header {
            padding: 12px 24px; background-color: var(--bg-sidebar); border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center;
        }
        .file-tab { background-color: var(--bg-editor); padding: 8px 16px; border-radius: 6px 6px 0 0; border: 1px solid var(--border-color); border-bottom: none; font-family: monospace; font-size: 0.85rem; margin-bottom: -13px; color: var(--accent-hover); }

        .editor-textarea-container { flex: 1; display: flex; background-color: #0d1117; padding: 16px; overflow: hidden; }
        .line-numbers { width: 35px; text-align: right; padding-right: 12px; font-family: 'Fira Code', 'Courier New', Courier, monospace; font-size: 14px; color: #484f58; user-select: none; line-height: 1.5; }
        
        textarea.code-input {
            flex: 1; background: transparent; border: none; color: #e6edf3;
            font-family: 'Fira Code', 'Courier New', Courier, monospace;
            font-size: 14px; line-height: 1.5; resize: none; outline: none; white-space: pre; overflow: auto;
        }

        .action-bar { padding: 12px 24px; background-color: var(--bg-sidebar); border-top: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
